name: "Plan and Execute JIRA Issue with AI CLI"
description: "Plan a JIRA issue, assign it to yourself, implement it with unit tests, and create a pull request using existing workflows"

params:
  base_branch: "develop"
  branch_prefix: "feature"
  remote: "origin"
  pr_base_branch: "develop"

steps:
  - id: select_issue
    name: "Select JIRA Issue"
    plugin: jira
    step: select_jira_issue

  - id: get_issue
    name: "Get Full Issue Details"
    plugin: jira
    step: get_issue

  - id: get_comments
    name: "Get Issue Comments"
    plugin: jira
    step: get_comments

  - id: build_task_context
    name: "Build Task Context"
    plugin: jira
    step: build_jira_task_context

  - id: plan_with_cli
    name: "Study Issue and Confirm Plan"
    plugin: core
    step: ai_code_assistant
    params:
      context_key: "jira_task_context"
      # This workflow's whole purpose is handing the issue off to an AI CLI, so skip the
      # "do you want AI assistance?" prompt and go straight to the launch.
      ask_confirmation: false
      fail_on_decline: false

  - id: confirm_and_assign_issue
    name: "Assign Issue to Yourself"
    plugin: jira
    step: confirm_and_assign_issue

  - id: create_issue_worktree
    name: "Create Isolated Issue Worktree"
    plugin: git
    step: create_worktree
    params:
      base_branch: "${base_branch}"
      new_branch: "${branch_prefix}/${jira_issue_key}"

  - id: activate_issue_worktree
    name: "Activate Issue Worktree"
    plugin: git
    step: activate_worktree_context

  - id: implement_with_cli
    name: "Implement Issue with Unit Tests"
    plugin: core
    step: ai_code_assistant
    params:
      context_key: "jira_implementation_context"
      cli_preference: "auto"
      ask_confirmation: true
      fail_on_decline: true
    on_error: fail

  - id: create_pull_request
    name: "Create Pull Request"
    workflow: "create-pr-ai"

  - id: cleanup_issue_worktree
    name: "Cleanup Issue Worktree"
    plugin: git
    step: cleanup_worktree_context
